[workspace]
members = ["crates/*", "apps/hide-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "=2.0.20"
minicbor = { version = "=2.3.0", features = ["std"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "chacha", "x25519", "mlkem"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.0", features = ["zeroize"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
getrandom = "=0.4.3"
clap = { version = "=4.6.6", features = ["derive"] }
tempfile = "=3.27.0"
proptest = "=1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
overflow-checks = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Property and vector tests decrypt megabytes; optimize dependencies in debug too.
[profile.test.package."*"]
opt-level = 2
