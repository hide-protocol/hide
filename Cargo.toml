[workspace]
members = ["crates/*", "apps/hide-cli"]
# The desktop app has its own workspace: it needs a built frontend before it
# compiles, which would make `cargo test --workspace` in CI depend on Node.
# fuzz/ needs nightly and libfuzzer; it is its own workspace too.
exclude = ["apps/hide-desktop/src-tauri", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hide-protocol/hide"
homepage = "https://github.com/hide-protocol/hide"
keywords = ["encryption", "cryptography", "post-quantum", "hpke", "ml-kem"]
categories = ["cryptography"]
# Publishing is deliberate, not automatic: the publish-sdks workflow is started
# by hand, names the version and says which registries.
publish = true

[workspace.dependencies]
thiserror = "=2.0.20"
minicbor = { version = "=2.3.0", features = ["std"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "chacha", "x25519", "mlkem"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.0", features = ["zeroize"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
getrandom = "=0.4.3"
clap = { version = "=4.6.6", features = ["derive"] }
tempfile = "=3.27.0"
proptest = "=1.11.0"
argon2 = { version = "=0.6.0", features = ["alloc"] }
rpassword = "=7.5.4"
base64 = "=0.23.1"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
# zeroize: without it the expanded ML-DSA signing key (several KiB) is not wiped on drop.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
interprocess = "=2.4.4"
# RFC 9420 group messaging. No third-party audit yet, which is stated in the
# README; HIDE adds no cryptography of its own on top.
mls-rs = "=0.56.0"
mls-rs-core = "=0.27.0"
mls-rs-crypto-rustcrypto = "=0.22.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
overflow-checks = true
codegen-units = 1
# Not "abort": hide-ffi is loaded into other people's processes (a PHP worker,
# a JVM, an IIS pool) and promises HIDE_ERR_PANIC instead of killing the host.
# catch_unwind can only keep that promise if panics unwind. The CLI would
# prefer abort, but Cargo has no per-package panic setting, and a smaller
# binary is not worth an inert safety net in every published library.
panic = "unwind"
strip = "symbols"

# Property and vector tests decrypt megabytes; optimize dependencies in debug too.
[profile.test.package."*"]
opt-level = 2
