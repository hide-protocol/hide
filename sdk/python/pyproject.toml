[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hide-protocol"
version = "0.7.0"
description = "Experimental hybrid post-quantum file and message encryption (X25519 + ML-KEM-768). Unaudited."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["encryption", "post-quantum", "cryptography", "hpke", "ml-kem"]
classifiers = [
  # Says plainly what the prose says: this is not ready for real data.
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hide-protocol/hide"
Source = "https://github.com/hide-protocol/hide"
Issues = "https://github.com/hide-protocol/hide/issues"
Documentation = "https://github.com/hide-protocol/hide/tree/main/docs"
Changelog = "https://github.com/hide-protocol/hide/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hide_protocol"]

# The compiled core is copied in by the release workflow, per platform.
artifacts = ["src/hide_protocol/*.so", "src/hide_protocol/*.dylib", "src/hide_protocol/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
