[package]
name = "hide-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["wasm", "browser", "post-quantum", "encryption", "webassembly"]
categories = ["cryptography", "wasm"]
publish = false
description = "WebAssembly bindings for HIDE: post-quantum encryption in the browser. Experimental, unaudited."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hide-crypto = { path = "../hide-crypto" }
hide-keyring = { path = "../hide-keyring" }
hide-object = { path = "../hide-object" }
hide-sign = { path = "../hide-sign" }
hide-identity = { path = "../hide-identity", version = "0.6.2" }
hide-epoch = { path = "../hide-epoch", version = "0.6.2" }
hide-transparency = { path = "../hide-transparency", version = "0.6.2" }
wasm-bindgen = "=0.2.128"
zeroize.workspace = true

# The browser has no OS randomness source unless getrandom is told to use
# crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.78"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
