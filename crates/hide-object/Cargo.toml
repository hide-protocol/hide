[package]
name = "hide-object"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hide-object"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Sealed container encryption with authenticated streaming for HIDE. Experimental, unaudited."

[features]
test-vectors = ["hide-crypto/test-vectors"]

[[example]]
name = "generate_vectors"
required-features = ["test-vectors"]

# The forgery tests reach into the test-only hooks; without this a plain
# `cargo test -p hide-object` fails to compile instead of skipping them.
[[test]]
name = "signing"
required-features = ["test-vectors"]

[dependencies]
hide-format = { path = "../hide-format", version = "0.7.0" }
hide-crypto = { path = "../hide-crypto", version = "0.7.0" }
hide-sign = { path = "../hide-sign", version = "0.7.0" }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
# Only the vector generator and the vector test need it: they must derive a key
# the same way every surface does.
hide-keyring = { path = "../hide-keyring" }

[lints]
workspace = true
