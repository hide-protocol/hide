[package]
name = "hide-object"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Sealed container encryption and decryption for the HIDE protocol"

[features]
test-vectors = ["hide-crypto/test-vectors"]

[[example]]
name = "generate_vectors"
required-features = ["test-vectors"]

[dependencies]
hide-format = { path = "../hide-format", version = "0.6.2" }
hide-crypto = { path = "../hide-crypto", version = "0.6.2" }
hide-sign = { path = "../hide-sign", version = "0.6.2" }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
# Only the vector generator and the vector test need it: they must derive a key
# the same way every surface does.
hide-keyring = { path = "../hide-keyring" }

[lints]
workspace = true
