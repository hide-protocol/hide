[package]
name = "hide-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hide-identity"
readme = "README.md"
keywords = ["identity", "device", "revocation", "recovery", "post-quantum"]
categories = ["cryptography", "authentication"]
publish.workspace = true
description = "Device enrollment, revocation and recovery for a HIDE identity. Experimental, unaudited."

[dependencies]
hide-sign = { path = "../hide-sign", version = "0.9.1" }
# EpochBinding verifies the chain it binds (spec §16.4).
hide-epoch = { path = "../hide-epoch", version = "0.9.1" }
sha2.workspace = true
zeroize.workspace = true
thiserror.workspace = true
minicbor.workspace = true

[dev-dependencies]
proptest.workspace = true
# EpochBinding verifies the chain it binds (spec §16.4).
hide-epoch = { path = "../hide-epoch", version = "0.9.1" }
# Only the subsystem vector checker needs these: it validates the epoch and
# transparency vectors alongside the identity ones.
hide-transparency = { path = "../hide-transparency" }

[lints]
workspace = true

# Only the subsystem vector checker needs this: it validates the transparency
# vectors alongside the identity ones.
