[package]
name = "hide-transparency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hide-transparency"
readme = "README.md"
keywords = ["merkle", "transparency-log", "rfc6962", "audit", "append-only"]
categories = ["cryptography"]
publish.workspace = true
description = "Append-only Merkle log with inclusion and consistency proofs for HIDE. Experimental, unaudited."

[dependencies]
hide-sign = { path = "../hide-sign", version = "0.10.0" }
sha2.workspace = true
thiserror.workspace = true
minicbor.workspace = true
base64.workspace = true
# Verifying a C2SP cosignature (c2sp.org/tlog-cosignature, Ed25519 algorithm)
# needs plain Ed25519 verification. HIDE-Sign's verifier requires both halves of
# the hybrid key, so it cannot check a witness's Ed25519-only signature.
ed25519-dalek.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
