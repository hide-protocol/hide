[package]
name = "hide-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C ABI for the HIDE protocol; the single core every language binding calls"

[lib]
name = "hide_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hide-crypto = { path = "../hide-crypto", version = "0.6.2" }
hide-keyring = { path = "../hide-keyring", version = "0.6.2" }
hide-object = { path = "../hide-object", version = "0.6.2" }
hide-sign = { path = "../hide-sign", version = "0.6.2" }
hide-identity = { path = "../hide-identity", version = "0.6.2" }
hide-epoch = { path = "../hide-epoch", version = "0.6.2" }
hide-transparency = { path = "../hide-transparency", version = "0.6.2" }
zeroize.workspace = true

[lints.rust]
# This crate IS the unsafe boundary; every other crate still forbids it.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
