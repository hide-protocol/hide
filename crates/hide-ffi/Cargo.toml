[package]
name = "hide-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hide-ffi"
readme = "README.md"
keywords = ["ffi", "c-abi", "bindings", "post-quantum", "encryption"]
categories = ["cryptography", "external-ffi-bindings"]
publish.workspace = true
description = "C ABI for HIDE: the single core every language binding calls. Experimental, unaudited."

[lib]
name = "hide_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hide-crypto = { path = "../hide-crypto", version = "0.7.0" }
hide-keyring = { path = "../hide-keyring", version = "0.7.0" }
hide-object = { path = "../hide-object", version = "0.7.0" }
hide-sign = { path = "../hide-sign", version = "0.7.0" }
hide-identity = { path = "../hide-identity", version = "0.7.0" }
hide-epoch = { path = "../hide-epoch", version = "0.7.0" }
hide-transparency = { path = "../hide-transparency", version = "0.7.0" }
zeroize.workspace = true

[lints.rust]
# This crate IS the unsafe boundary; every other crate still forbids it.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
