name: Security finding
description: Read this first. Security issues are NOT filed here.
labels: ["invalid"]
body:
  - type: markdown
    attributes:
      value: |
        ## Do NOT file security issues here

        A suspected vulnerability in HIDE must be reported **privately**, not in a public issue, as described in [SECURITY.md](https://github.com/hide-protocol/hide/blob/main/SECURITY.md). There are two private channels:

        - GitHub private vulnerability reporting: <https://github.com/hide-protocol/hide/security/advisories/new>. The form is access-controlled, so prefer it for anything with sensitive detail.
        - Email: <hide-security@codai.ro>. Mail is not end-to-end encrypted and no PGP key is published.

        Include the affected version or commit, a reproduction (a container plus the steps), and the impact you believe it has. HIDE has one maintainer: a report is acknowledged as soon as he reads it, with no guaranteed response time. If you have had no reply after 14 days, send it again through the other channel. Only the latest release line receives fixes. There is no bounty; a finding is credited in the CHANGELOG and in [docs/advisories.md](https://github.com/hide-protocol/hide/blob/main/docs/advisories.md) unless you prefer otherwise.

        HIDE is experimental and unaudited. Behaviour already listed under "What this version does not protect against" in SECURITY.md or in [docs/threat-model.md](https://github.com/hide-protocol/hide/blob/main/docs/threat-model.md) is a documented limitation, not a vulnerability; a bug report is the right form for a doc that is wrong.

        Please close this issue without submitting it.
  - type: checkboxes
    id: ack
    attributes:
      label: Confirmation
      options:
        - label: I understand that this template exists only to redirect me, and that I will use one of the two private channels instead of filing details here.
          required: true
