# Actions are pinned to commit SHAs so a repointed tag cannot change what runs
# with id-token: write. Dependabot is what keeps those pins from going stale.
# Cargo dependencies are pinned with `=` because the wire format depends on
# them; a bump there is a deliberate, tested change, so it is proposed weekly
# rather than applied.
# Every ecosystem is grouped so a week yields one PR per ecosystem instead of
# one per crate (each superseded per-crate PR re-ran the full CI and mailed the
# owner). Majors stay separate: they are the ones that can move the wire format.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  # One entry for the two lockfiles that ship; the desktop crate is outside the
  # cargo workspace, so the root lockfile alone never sees it.
  # /fuzz is deliberately NOT listed. Its only registry dependency is
  # libfuzzer-sys; everything else is a path dependency on the root crates, so
  # its PRs edited the ROOT Cargo.toml without moving the root Cargo.lock,
  # duplicated the PRs opened for `/`, and proposed versions the root had
  # refused for MSRV (fuzz/ declares no rust-version, so the MSRV job never
  # judged them). fuzz/Cargo.lock is committed and refreshed by hand with the
  # root lock; scripts/check-lock-drift.mjs (CI `lint`) fails when the two
  # disagree on a wire-relevant crate.
  - package-ecosystem: cargo
    directories:
      - /
      - /apps/hide-desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
  # The independent Node verifier's crypto libraries ARE the second opinion on
  # the wire format; a stale one is a weaker check.
  - package-ecosystem: npm
    directories:
      - /sdk/node
      - /conformance/node
      - /apps/hide-desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      pip-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: nuget
    directory: /sdk/dotnet/HideProtocol
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      nuget-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      go-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: composer
    directory: /sdk/php
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      composer-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: maven
    directory: /sdk/java
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      maven-minor:
        update-types: ["minor", "patch"]
