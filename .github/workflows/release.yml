name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross: true
          # Statically linked, so it runs on Alpine and in scratch containers
          # where the glibc build cannot.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Cross-compiled targets need both a linker and the target's C library.
      # --no-install-recommends drops the -cross libc packages, so name them.
      - name: Install a cross linker
        if: matrix.cross
        run: |
          set -euo pipefail
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y --no-install-recommends musl-tools musl-dev
              ;;
          esac

      # A release binary that cannot decrypt the frozen vectors is not shippable.
      # Cross-compiled binaries cannot run here, so the check is host-native.
      - run: cargo test -p hide-object --test vectors --release
        if: '!matrix.cross'
      - run: cargo build --release --locked -p hide-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="hide-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/hide.exe" ]; then
            cp "target/${{ matrix.target }}/release/hide.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/hide" "dist/$name/"
          fi
          cp README.md LICENSE SECURITY.md "dist/$name/"
          cp spec/hide-0.1.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 7

  # The desktop application and the portable build. Kept in a separate job so a
  # failure here never blocks the CLI, and so the Node toolchain is installed
  # only where it is actually needed.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/hide-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hide-desktop/src-tauri
          key: desktop-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/hide-desktop/pnpm-lock.yaml

      # WebKitGTK is the Linux webview; the other platforms use the system one.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        working-directory: .

      - run: pnpm install --frozen-lockfile --ignore-workspace

      # The desktop app must agree with the CLI about the format.
      - name: Verify the two surfaces interoperate
        run: |
          cargo build --release -p hide-cli
          cargo test --release --manifest-path apps/hide-desktop/src-tauri/Cargo.toml
        working-directory: .

      - name: Build the installer
        run: pnpm tauri build

      - name: Build the portable executable
        run: pnpm build:portable

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          release="src-tauri/target/release"
          out="../../dist"
          mkdir -p "$out"

          # Installers, whatever the platform produced.
          find "$release/bundle" -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} "$out/" \; 2>/dev/null || true

          # The portable build is a single self-contained executable.
          portable="hide-portable-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$out/$portable"
          if [ -f "$release/hide-desktop.exe" ]; then
            cp "$release/hide-desktop.exe" "$out/$portable/HIDE-Portable.exe"
          else
            cp "$release/hide-desktop" "$out/$portable/HIDE-Portable"
          fi
          cp ../../README.md ../../LICENSE ../../SECURITY.md "$out/$portable/"

          cd "$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$portable.zip" "$portable" >/dev/null
          else
            tar -czf "$portable.tar.gz" "$portable"
          fi
          rm -rf "$portable"

          for file in *.exe *.dmg *.deb *.AppImage *.zip *.tar.gz; do
            [ -f "$file" ] || continue
            # Windows runners have sha256sum but not shasum.
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$file" | cut -d' ' -f1 > "$file.sha256"
            else
              sha256sum "$file" | cut -d' ' -f1 > "$file.sha256"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/*
            !dist/*/
          retention-days: 7

  publish:
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          for file in *.sha256; do
            printf '%s  %s\n' "$(cat "$file")" "${file%.sha256}" >> SHA256SUMS
          done
          cat SHA256SUMS

      # Package-manager manifests are generated from the checksums that were
      # just computed, so a manifest can never quote a stale hash.
      - name: Generate package manager manifests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash packaging/generate.sh "$version" dist
          ls -la dist/packaging

      - uses: actions/upload-artifact@v7
        with:
          name: packaging-manifests
          path: dist/packaging/**
          retention-days: 30

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
          prerelease: true
          generate_release_notes: true
          body: |
            **Experimental and unaudited. Do not protect real data with this release.**

            HIDE implements the file-format engine: HPKE X-Wing (X25519 +
            ML-KEM-768) key wrapping, and authenticated 64 KiB streaming with
            constant memory.

            ### What to download

            - **Desktop application** — `HIDE_*_x64-setup.exe` (Windows),
              `*.dmg` (macOS), `*.deb` / `*.AppImage` (Linux). Installs a
              graphical application for keys, files and messages.
            - **Portable** — `hide-portable-*`. A single executable that needs
              no installation and keeps its keys in a `hide-keys` folder beside
              itself. Suitable for a USB stick.
            - **Command line** — `hide-*`. The `hide` tool.

            There is no identity system, no key transparency, no sender
            authentication, no forward secrecy and no hardware-backed key
            storage. Secret keys are sealed with a passphrase by default, but
            `--insecure-plaintext` writes one unencrypted. See SECURITY.md.

            The wire format may change while the version is 0.x.

            Verify a download against `SHA256SUMS` before running it.
