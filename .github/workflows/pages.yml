name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - llms.txt
      - llms-full.txt
      - README.md
      - docs/**
      - scripts/build-llms-full.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: llms-full.txt is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # The bundle is a concatenation of README/docs/SECURITY. Regenerating it
      # and diffing means it cannot silently drift from the documents it quotes.
      - run: node scripts/build-llms-full.mjs
      - run: git diff --exit-code -- llms-full.txt
      # RFC 9116 makes Expires mandatory and a reader must ignore the file once
      # it has passed. Nothing else would notice the date going by.
      - name: security.txt has not expired
        run: |
          node -e '
            const text = require("node:fs").readFileSync("site/.well-known/security.txt", "utf8");
            const match = /^Expires: (.+)$/m.exec(text);
            if (!match) { console.error("security.txt has no Expires field"); process.exit(1); }
            const days = (Date.parse(match[1]) - Date.now()) / 86400000;
            if (!(days > 0)) { console.error("security.txt expired: " + match[1]); process.exit(1); }
            if (days < 60) console.log("::warning file=site/.well-known/security.txt::expires in " + Math.floor(days) + " days");
          '

  deploy:
    name: Deploy GitHub Pages
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # llms.txt is committed once at the root (where llmstxt.org expects it in
      # the repo) and copied here rather than duplicated in site/.
      - run: cp llms.txt llms-full.txt site/
      # `enablement` creates the Pages site through the API on first run; the
      # alternative is a human clicking through Settings, which this repo has
      # no other manual step for.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # The action's tar excludes dot-entries by default, which would drop
          # site/.well-known/security.txt without any error.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
