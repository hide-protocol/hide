name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - llms.txt
      - llms-full.txt
      - README.md
      - docs/**
      - scripts/build-llms-full.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: llms-full.txt is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # The bundle is a concatenation of README/docs/SECURITY. Regenerating it
      # and diffing means it cannot silently drift from the documents it quotes.
      - run: node scripts/build-llms-full.mjs
      - run: git diff --exit-code -- llms-full.txt

  deploy:
    name: Deploy GitHub Pages
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # llms.txt is committed once at the root (where llmstxt.org expects it in
      # the repo) and copied here rather than duplicated in site/.
      - run: cp llms.txt llms-full.txt site/
      # `enablement` creates the Pages site through the API on first run; the
      # alternative is a human clicking through Settings, which this repo has
      # no other manual step for.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
