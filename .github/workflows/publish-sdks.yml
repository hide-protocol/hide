name: Publish SDKs

# Publishing to a registry claims a name permanently and, on crates.io and
# PyPI, cannot be undone — only yanked. So this never runs automatically on a
# tag: a person starts it, names the version, and says which registries.
#
# No registry credential is stored in this repository. Every publish job
# exchanges the run's OIDC identity for a short-lived token (trusted
# publishing); `gh secret list` must stay empty. Each job also installs the
# generated THIRD-PARTY-LICENSES.txt beside the compiled core, because the
# core statically links third-party crates whose licences require it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.1)"
        required: true
      crates:
        description: "Publish the Rust crates to crates.io"
        type: boolean
        default: false
      pypi:
        description: "Publish the Python SDK to PyPI"
        type: boolean
        default: false
      npm:
        description: "Publish the Node and WASM SDKs to npm"
        type: boolean
        default: false
      rubygems:
        description: "Publish the Ruby SDK to RubyGems"
        type: boolean
        default: false
      nuget:
        description: "Publish the .NET SDK to NuGet"
        type: boolean
        default: false
      dry_run:
        description: "Build and validate everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Same pin as release.yml: the notices are a legal artifact.
  CARGO_ABOUT_VERSION: "0.9.3"

jobs:
  # Nothing is published unless the whole suite passes at the exact commit
  # being published.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --all-features --locked
      - name: The version in the tree must match what is being published
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "$REQUESTED" ]; then
            echo "::error::Cargo.toml says $declared, but $REQUESTED was requested" >&2
            exit 1
          fi

      # The same two checks release.yml runs: the licence file is the real
      # Apache-2.0 text, and every .crate about to be uploaded carries it.
      - name: LICENSE must be the complete, unmodified Apache-2.0 text
        run: |
          set -euo pipefail
          echo "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30  LICENSE" \
            | sha256sum --check
      - name: Every published crate must carry LICENSE and a README
        run: |
          set -euo pipefail
          crates="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish == null) | .name')"
          [ -n "$crates" ] || { echo "::error::no publishable crates found"; exit 1; }
          for crate in $crates; do
            listing="$(cargo package --list --locked -p "$crate")"
            for file in LICENSE README.md; do
              grep -qx "$file" <<<"$listing" \
                || { echo "::error::the $crate crate would be published without $file"; exit 1; }
            done
          done
          echo "all crates carry LICENSE and README.md"

      # Notices for the native library and the WASM module, once, for the SDK
      # jobs below. The npm, gem and wheel for a platform each carry the file
      # for that platform's graph; the one NuGet package carries every graph.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version "$CARGO_ABOUT_VERSION" --features cli
      - name: Generate the third-party notices
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/notices"
          mkdir -p "$out"
          for target in \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl \
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc \
            aarch64-apple-darwin x86_64-apple-darwin; do
            bash scripts/licences/generate.sh ffi "$target" "$out/ffi-$target.txt"
          done
          bash scripts/licences/generate.sh ffi all "$out/ffi-all.txt"
          bash scripts/licences/generate.sh wasm wasm32-unknown-unknown "$out/wasm.txt"
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: ${{ runner.temp }}/notices/*.txt
          if-no-files-found: error
          retention-days: 7

  crates:
    needs: verify
    if: inputs.crates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: crates-io
    # Trusted publishing: crates.io mints a short-lived token from this run's
    # OIDC identity, so no CARGO_REGISTRY_TOKEN secret is needed.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      # Order matters: a crate cannot be published before its dependencies.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # An array, so the flags survive word splitting as separate args.
          flags=(--locked)
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          fi
          # Dependency order: each crate's dependencies must already be on the
          # index when it is published, or cargo refuses it.
          for crate in hide-format hide-crypto hide-sign hide-transparency hide-epoch hide-identity hide-mls hide-keyring hide-object hide-ffi hide-cli; do
            echo "::group::$crate"
            if [ "$DRY_RUN" = "true" ]; then
              # A dependent cannot resolve its sibling during a dry run: the
              # new version exists only in this checkout. That shows up either
              # as a missing crate (before its first publish) or as a missing
              # version (every release after). Both are expected; every other
              # error still fails the job.
              if ! out=$(cargo publish "${flags[@]}" -p "$crate" 2>&1); then
                echo "$out"
                echo "$out" | grep -Eq "no matching package named .hide-|failed to select a version for the requirement .hide-" \
                  || { echo "::error::$crate failed for a reason other than an unpublished sibling"; exit 1; }
                echo "::notice::$crate: sibling not on crates.io yet, expected before the first publish"
              else
                echo "$out"
              fi
            else
              # crates.io permits one NEW crate per 10 minutes, so a set this
              # size cannot go out in one pass. A half-published set cannot be
              # undone, so a rerun must skip what is already up rather than
              # start over: cargo's own error is the authority on that.
              published=yes
              for attempt in 1 2 3 4 5 6 7; do
                if out=$(cargo publish "${flags[@]}" -p "$crate" 2>&1); then
                  echo "$out"; break
                fi
                echo "$out"
                case "$out" in
                  *"already exists on crates.io index"*)
                    echo "::notice::$crate $VERSION is already published, skipping"
                    published=no; break ;;
                  *"429 Too Many Requests"*) ;;
                  *) echo "::error::$crate failed for a reason other than the rate limit"; exit 1 ;;
                esac
                echo "::notice::rate limited on $crate, waiting 10 minutes (attempt $attempt)"
                [ "$attempt" = 7 ] && { echo "::error::still rate limited after 7 attempts"; exit 1; }
                sleep 620
              done
              # crates.io needs a moment before a dependent crate can resolve it.
              if [ "$published" = yes ]; then sleep 30; fi
            fi
            echo "::endgroup::"
          done

  pypi:
    needs: verify
    if: inputs.pypi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment: pypi
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            wheel: manylinux_2_28_x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            wheel: win_amd64
          - os: macos-15
            target: aarch64-apple-darwin
            wheel: macosx_11_0_arm64
    env:
      TARGET: ${{ matrix.target }}
      WHEEL_TAG: ${{ matrix.wheel }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: cargo build --release --locked -p hide-ffi

      # sdk/python has its own README; copying the root one here would replace
      # it on PyPI. The licence is not in the tree, so it is staged. hatchling
      # packs root files named LICENSE* into dist-info/licenses/, which is how
      # the third-party notices reach the wheel without a pyproject change.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Stage the licence and the third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE sdk/python/
          cp "notices/ffi-$TARGET.txt" sdk/python/LICENSE-THIRD-PARTY.txt

      # The wheel carries the compiled core, so installing it needs no
      # toolchain on the user's machine.
      - name: Bundle the native library into the package
        shell: bash
        run: |
          set -euo pipefail
          for name in libhide_ffi.so libhide_ffi.dylib hide_ffi.dll; do
            if [ -f "target/release/$name" ]; then
              cp "target/release/$name" sdk/python/src/hide_protocol/
            fi
          done
          ls -la sdk/python/src/hide_protocol/

      - name: Test the package as installed
        shell: bash
        working-directory: sdk/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .
          python -m pytest -q

      # hatchling has no idea the package became platform-specific when the
      # native library was copied in, so it tags the wheel py3-none-any. All
      # three builds would then share one filename and PyPI would serve
      # whichever landed first to every platform. Retag with the real one.
      - name: Build the wheel
        shell: bash
        working-directory: sdk/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade wheel
          python -m build --wheel
          python -m wheel tags --remove \
            --platform-tag "$WHEEL_TAG" \
            dist/*-py3-none-any.whl
          wheel="dist/hide_protocol-$VERSION-py3-none-$WHEEL_TAG.whl"
          test -f "$wheel"
          # Both licence files must be inside, or the wheel ships a binary
          # whose licences are nowhere in the package.
          listing="$(python -m zipfile -l "$wheel")"
          for file in LICENSE LICENSE-THIRD-PARTY.txt; do
            grep -q "dist-info/licenses/$file" <<<"$listing" \
              || { echo "::error::$wheel has no $file"; exit 1; }
          done
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: sdk/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  pypi-upload:
    needs: pypi
    if: inputs.pypi && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist

  # One compile of the core per platform, shared by npm, RubyGems and NuGet.
  # Building it inside each job would give three chances to disagree about
  # which binary a user gets.
  native:
    needs: verify
    if: inputs.npm || inputs.rubygems || inputs.nuget
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native-${{ matrix.target }}

      - name: Install a cross linker
        if: matrix.cross
        run: |
          set -euo pipefail
          sudo apt-get update
          case "$TARGET" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y --no-install-recommends musl-tools musl-dev
              # musl defaults to crt-static, and a cdylib cannot be statically
              # linked: the target builds cleanly and emits no .so at all.
              echo 'RUSTFLAGS=-C target-feature=-crt-static' >> "$GITHUB_ENV"
              ;;
          esac

      - run: cargo build --release --locked -p hide-ffi --target "$TARGET"
        shell: bash

      # A library that cannot decrypt the frozen vectors is not shippable.
      # Cross-compiled ones cannot run here, so the check is host-native.
      - run: cargo test -p hide-object --test vectors --release --locked
        if: '!matrix.cross'

      # The notices travel with the library from here on, so every packaging
      # job below finds them beside the binary under the same artifact name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for name in libhide_ffi.so libhide_ffi.dylib hide_ffi.dll; do
            if [ -f "target/$TARGET/release/$name" ]; then
              cp "target/$TARGET/release/$name" out/
            fi
          done
          test -n "$(ls -A out)"
          cp "notices/ffi-$TARGET.txt" out/THIRD-PARTY-LICENSES.txt
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: [verify, native]
    if: inputs.npm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    # --provenance signs the package with an OIDC token from this run.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles 10.x.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices

      # npm always packs a root file named LICENSE.* regardless of "files", so
      # the notices are staged under that name and reach every package
      # without touching three package.json files.
      - name: Build the WASM package
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo build --release --locked -p hide-wasm --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/release/hide_wasm.wasm \
            --out-dir sdk/wasm --target web
          cp LICENSE sdk/wasm/
          cp notices/wasm.txt sdk/wasm/LICENSE.third-party.txt

      # package.json lists LICENSE in "files"; npm omits a missing file silently.
      # The README is sdk/node's own and must not be replaced by the root one.
      # The loader package contains no compiled code; its notices are those of
      # the library every platform package carries, listed for all targets.
      - name: Stage the licence and the notices
        run: |
          set -euo pipefail
          cp LICENSE sdk/node/
          cp notices/ffi-all.txt sdk/node/LICENSE.third-party.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native

      # One npm package per platform, each refusing to install on the wrong
      # machine via os/cpu/libc. hide-protocol lists all seven as optional
      # dependencies, so exactly one resolves.
      - name: Build the platform packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for dir in native/native-*; do
            target="${dir#native/native-}"
            # The artifact holds the library and its notices; pick by suffix.
            library="$(find "$dir" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -printf '%f\n')"
            [ "$(wc -l <<<"$library")" -eq 1 ] || { echo "::error::expected one library in $dir, found: $library"; exit 1; }
            out="$(node scripts/pack-native.mjs npm "$target" "$VERSION" "$dir/$library" platform-packages)"
            cp "$dir/THIRD-PARTY-LICENSES.txt" "$out/LICENSE.third-party.txt"
          done
          ls -la platform-packages/*

      - name: Build and test the Node package
        run: |
          set -euo pipefail
          cd sdk/node
          # Not npm ci: the lockfile cannot pin the platform packages at a
          # version this run has not published yet, and npm records such an
          # optional dependency with an EMPTY version that npm ci rejects.
          npm install --no-audit --no-fund
          npm run build
          HIDE_LIBRARY=$GITHUB_WORKSPACE/native/native-x86_64-unknown-linux-gnu/libhide_ffi.so \
          HIDE_ALLOW_LIBRARY_OVERRIDE=1 \
            node --test dist/index.test.js

      # What npm will actually upload, package by package: the notices must be
      # in every tarball, or a binary ships without its licences.
      #
      # This runs AFTER the Node build, and with --ignore-scripts, for two
      # reasons learned on 2026-11-15. sdk/node declares `prepack: npm run
      # build`, so `npm pack` in a tree whose dev dependencies are not installed
      # yet runs `tsc`, fails with `error TS2688: Cannot find type definition
      # file for 'node'`, and prints that INSTEAD of the JSON — the check then
      # died in JSON.parse with a message about nothing. And a listing taken
      # before the build describes a package that will never ship: `files` names
      # `dist`, which does not exist yet. --ignore-scripts makes the listing a
      # pure question about the manifest, so it is the same at either point and
      # cannot be broken by a build.
      - name: Every package must contain LICENSE and LICENSE.third-party.txt
        run: |
          set -euo pipefail
          for pkg in ./sdk/wasm ./sdk/node ./platform-packages/*; do
            raw="$(npm pack --dry-run --json --ignore-scripts "$pkg" 2>/dev/null)"
            listing="$(printf '%s' "$raw" | node -e '
              let text = require("fs").readFileSync(0, "utf8");
              let parsed;
              try {
                parsed = JSON.parse(text);
              } catch (error) {
                console.error("could not read npm pack --json output:", error.message);
                console.error(text.slice(0, 4000));
                process.exit(1);
              }
              const pack = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
              console.log(pack.files.map((f) => f.path).join("\n"));
            ')"
            for file in LICENSE LICENSE.third-party.txt; do
              grep -qx "$file" <<<"$listing" \
                || { echo "::error::$pkg would be published without $file"; exit 1; }
            done
            echo "$pkg: LICENSE and LICENSE.third-party.txt packed"
          done

      # The published loader must find the published package, not a stray copy
      # left in the build tree. Installing the tarballs into a clean directory
      # is the only thing that proves it.
      - name: Prove the platform package resolves with nothing else present
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" ./sdk/node >/dev/null
          npm pack --pack-destination "$RUNNER_TEMP" ./platform-packages/linux-x64 >/dev/null
          work=$(mktemp -d)
          cd "$work"
          echo '{"name":"probe","private":true,"type":"module"}' > package.json
          npm install --silent \
            "$RUNNER_TEMP/hide-protocol-$VERSION.tgz" \
            "$RUNNER_TEMP/hide-protocol-linux-x64-$VERSION.tgz"
          env -u HIDE_LIBRARY node -e "
            const m = await import('hide-protocol');
            const sk = m.SecretKey.generate();
            const c = m.encrypt(Buffer.from('secret'), [sk.publicKey()]);
            if (m.decrypt(c, sk).data.toString() !== 'secret') throw new Error('round trip failed');
            console.log('resolved the platform package with no HIDE_LIBRARY');
          "

      # No NODE_AUTH_TOKEN and no --provenance: the CLI detects OIDC, and
      # provenance is generated automatically under trusted publishing.
      - name: Publish
        if: '!inputs.dry_run'
        run: |
          set -euo pipefail
          npm --version
          # A rerun after a partial failure must not stop at the packages that
          # already went out. Without ./ npm reads a bare relative path as a
          # git shorthand and tries to clone it over ssh.
          publish() {
            if out=$(npm publish --access public "$1" 2>&1); then
              echo "$out"
            else
              echo "$out"
              echo "$out" | grep -q "cannot publish over the previously published" \
                || { echo "::error::$1 failed for a reason other than being already published"; exit 1; }
              echo "::notice::$1 is already on npm at this version"
            fi
          }
          publish ./sdk/wasm
          # The platform packages must exist before the package that depends on
          # them, or the first install of hide-protocol resolves nothing.
          for dir in platform-packages/*; do
            publish "./$dir"
          done
          publish ./sdk/node

  rubygems:
    needs: [verify, native]
    if: inputs.rubygems
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: rubygems
    # Trusted publishing: no GEM_HOST_API_KEY secret.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native

      - name: Run the suite against the built core
        run: |
          set -euo pipefail
          cd sdk/ruby
          HIDE_LIBRARY=$GITHUB_WORKSPACE/native/native-x86_64-unknown-linux-gnu/libhide_ffi.so \
          HIDE_ALLOW_LIBRARY_OVERRIDE=1 \
            ruby -Ilib -Itest test/test_hide.rb

      - name: Stage the licence
        run: cp LICENSE sdk/ruby/

      # One gem per platform: `gem install` then fetches only this machine's
      # binary instead of all seven. The loader looks beside binding.rb, which
      # is where pack-native.mjs puts it and what the gemspec globs.
      - name: Build a gem per platform
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p gems
          for dir in native/native-*; do
            target="${dir#native/native-}"
            # The artifact holds the library and its notices; pick by suffix.
            library="$(find "$dir" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -printf '%f\n')"
            [ "$(wc -l <<<"$library")" -eq 1 ] || { echo "::error::expected one library in $dir, found: $library"; exit 1; }
            rm -f sdk/ruby/lib/hide_protocol/*.so sdk/ruby/lib/hide_protocol/*.dylib \
                  sdk/ruby/lib/hide_protocol/*.dll
            # The notices of this platform's library, beside it. The committed
            # gemspec globs README.md and LICENSE only; a one-line wrapper
            # spec adds the notices for this build, so the SDK tree needs no
            # generated file to build a plain source gem locally.
            cp "$dir/THIRD-PARTY-LICENSES.txt" sdk/ruby/LICENSE-THIRD-PARTY.txt
            cat > sdk/ruby/hide-protocol-release.gemspec <<'RUBY'
          spec = Gem::Specification.load("hide-protocol.gemspec")
          spec.files += ["LICENSE-THIRD-PARTY.txt"]
          spec
          RUBY
            platform=$(node scripts/pack-native.mjs gem "$target" "$VERSION" "$dir/$library")
            ( cd sdk/ruby && HIDE_GEM_PLATFORM="$platform" gem build hide-protocol-release.gemspec )
            gem="sdk/ruby/hide-protocol-$VERSION-$platform.gem"
            # A gem is a tar of data.tar.gz; list the data to see what ships.
            listing="$(tar -xOf "$gem" data.tar.gz | tar -tz)"
            for file in LICENSE LICENSE-THIRD-PARTY.txt; do
              grep -qx "$file" <<<"$listing" \
                || { echo "::error::$gem does not contain $file"; exit 1; }
            done
            mv "$gem" gems/
          done
          ls -la gems

      # A gem that installs but cannot load its own binary is worse than one
      # that refuses: prove the vendored library is found with nothing else set.
      - name: Prove the vendored library loads
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gem install --no-document --install-dir "$work" \
            "gems/hide-protocol-$VERSION-x86_64-linux.gem"
          env -u HIDE_LIBRARY GEM_HOME="$work" ruby \
            -I "$work/gems/hide-protocol-$VERSION-x86_64-linux/lib" -e '
              require "hide_protocol"
              sk = Hide::SecretKey.generate
              c = Hide.encrypt("secret", recipients: [sk.public_key])
              raise "round trip failed" unless Hide.decrypt(c, sk).data == "secret"
              puts "loaded the vendored library with no HIDE_LIBRARY"
            '

      # Exchanges the run's OIDC identity for a short-lived RubyGems credential
      # and writes it where `gem push` looks. rubygems/release-gem does not fit:
      # it drives `rake release`, and this gem is built with `gem build`.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: '!inputs.dry_run'
      - name: Publish
        if: '!inputs.dry_run'
        run: |
          set -euo pipefail
          for gem in gems/*.gem; do
            gem push "$gem"
          done

  nuget:
    needs: [verify, native]
    if: inputs.nuget
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: nuget
    # Trusted publishing: NuGet/login exchanges OIDC for a 1-hour API key.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native

      - name: Run the suite against the built core
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/native/native-x86_64-unknown-linux-gnu/libhide_ffi.so
          HIDE_ALLOW_LIBRARY_OVERRIDE: "1"
        run: dotnet test sdk/dotnet --verbosity quiet

      # NuGet can carry every platform in one package, so unlike npm and
      # RubyGems there is nothing to fan out: the runtime picks the folder.
      - name: Stage the binaries under their runtime identifiers
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # the ${...} are JavaScript template literals
          node -e '
            const {mkdirSync, copyFileSync, readdirSync, readFileSync} = require("node:fs");
            const {targets} = JSON.parse(readFileSync("sdk/native-targets.json", "utf8"));
            for (const t of targets) {
              const from = `native/native-${t.target}`;
              const dir = `sdk/dotnet/HideProtocol/runtimes/${t.rid}/native`;
              mkdirSync(dir, {recursive: true});
              // The artifact also holds the notices file: pick the library by
              // its extension, never by position.
              const libraries = readdirSync(from).filter((f) => /\.(so|dylib|dll)$/.test(f));
              if (libraries.length !== 1) throw new Error(`${from}: expected one library, found ${libraries}`);
              copyFileSync(`${from}/${libraries[0]}`, `${dir}/${t.library}`);
            }
          '
          find sdk/dotnet/HideProtocol/runtimes -type f

      # One package carries seven binaries, so it carries the union of their
      # notices (ffi-all). The csproj packs README.md and the runtimes; the two
      # licence files are added through a Directory.Build.props written here,
      # beside the project, so that a plain local `dotnet pack` still works
      # without generated files and no SDK source changes for a release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Stage the licence and the notices into the package
        run: |
          set -euo pipefail
          cp notices/ffi-all.txt sdk/dotnet/HideProtocol/THIRD-PARTY-LICENSES.txt
          test ! -e sdk/dotnet/Directory.Build.props
          cat > sdk/dotnet/Directory.Build.props <<'XML'
          <Project>
            <!-- Written by publish-sdks.yml for the pack step only. -->
            <!-- LICENSE is NOT listed here: HideProtocol.csproj already packs
                 the repository-root one, and a second include of the same
                 target path is NU5118, which TreatWarningsAsErrors makes
                 fatal. The assertion after the pack proves both files are in
                 the package, so removing the duplicate cannot hide a gap. -->
            <ItemGroup Condition="'$(IsPackable)' == 'true'">
              <None Include="$(MSBuildProjectDirectory)/THIRD-PARTY-LICENSES.txt" Pack="true" PackagePath="\" />
            </ItemGroup>
          </Project>
          XML

      - name: Pack
        run: dotnet pack sdk/dotnet/HideProtocol/HideProtocol.csproj -c Release -o nupkg

      - name: The package must carry a binary for every runtime, and the licences
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          nupkg="nupkg/HideProtocol.$VERSION.nupkg"
          listing="$(unzip -l "$nupkg")"
          grep runtimes/ <<<"$listing"
          for rid in linux-x64 linux-arm64 linux-musl-x64 win-x64 win-arm64 osx-arm64 osx-x64; do
            grep -q "runtimes/$rid/native/" <<<"$listing" \
              || { echo "::error::the package has no native library for $rid"; exit 1; }
          done
          for file in LICENSE THIRD-PARTY-LICENSES.txt; do
            grep -Eq " $file\$" <<<"$listing" \
              || { echo "::error::the package has no $file"; exit 1; }
          done
          echo "every runtime and both licence files are in $nupkg"

      - name: NuGet login (OIDC -> short-lived key)
        if: '!inputs.dry_run'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          # The nuget.org profile name, not a credential.
          user: dragoscatalin
      - name: Publish
        if: '!inputs.dry_run'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push 'nupkg/*.nupkg' --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
