name: Publish SDKs

# Publishing to a registry claims a name permanently and, on crates.io and
# PyPI, cannot be undone — only yanked. So this never runs automatically on a
# tag: a person starts it, names the version, and says which registries.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.1)"
        required: true
      crates:
        description: "Publish the Rust crates to crates.io"
        type: boolean
        default: false
      pypi:
        description: "Publish the Python SDK to PyPI"
        type: boolean
        default: false
      npm:
        description: "Publish the Node and WASM SDKs to npm"
        type: boolean
        default: false
      rubygems:
        description: "Publish the Ruby SDK to RubyGems"
        type: boolean
        default: false
      nuget:
        description: "Publish the .NET SDK to NuGet"
        type: boolean
        default: false
      dry_run:
        description: "Build and validate everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Nothing is published unless the whole suite passes at the exact commit
  # being published.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: The version in the tree must match what is being published
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::Cargo.toml says $declared, but $"'{{ inputs.version }}'" was requested" >&2
            exit 1
          fi

  crates:
    needs: verify
    if: inputs.crates
    runs-on: ubuntu-24.04
    environment: crates-io
    # Trusted publishing: crates.io mints a short-lived token from this run's
    # OIDC identity, so no CARGO_REGISTRY_TOKEN secret is needed.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Order matters: a crate cannot be published before its dependencies.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          flags="--locked"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          # Dependency order: each crate's dependencies must already be on the
          # index when it is published, or cargo refuses it.
          for crate in hide-format hide-crypto hide-sign hide-transparency hide-epoch hide-identity hide-mls hide-keyring hide-object hide-ffi hide-cli; do
            echo "::group::$crate"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              # Until the first real publish, a dependent cannot resolve its
              # sibling: the version exists only in this checkout. That one
              # error is expected; every other one still fails the job.
              if ! out=$(cargo publish $flags -p "$crate" 2>&1); then
                echo "$out"
                echo "$out" | grep -q "no matching package named .hide-" \
                  || { echo "::error::$crate failed for a reason other than an unpublished sibling"; exit 1; }
                echo "::notice::$crate: sibling not on crates.io yet, expected before the first publish"
              else
                echo "$out"
              fi
            else
              # crates.io permits one NEW crate per 10 minutes, so a set this
              # size cannot go out in one pass. A half-published set cannot be
              # undone, so a rerun must skip what is already up rather than
              # start over: cargo's own error is the authority on that.
              published=yes
              for attempt in 1 2 3 4 5 6 7; do
                if out=$(cargo publish $flags -p "$crate" 2>&1); then
                  echo "$out"; break
                fi
                echo "$out"
                case "$out" in
                  *"already exists on crates.io index"*)
                    echo "::notice::$crate ${{ inputs.version }} is already published, skipping"
                    published=no; break ;;
                  *"429 Too Many Requests"*) ;;
                  *) echo "::error::$crate failed for a reason other than the rate limit"; exit 1 ;;
                esac
                echo "::notice::rate limited on $crate, waiting 10 minutes (attempt $attempt)"
                [ "$attempt" = 7 ] && { echo "::error::still rate limited after 7 attempts"; exit 1; }
                sleep 620
              done
              # crates.io needs a moment before a dependent crate can resolve it.
              if [ "$published" = yes ]; then sleep 30; fi
            fi
            echo "::endgroup::"
          done

  pypi:
    needs: verify
    if: inputs.pypi
    runs-on: ${{ matrix.os }}
    environment: pypi
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            wheel: manylinux_2_28_x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            wheel: win_amd64
          - os: macos-15
            target: aarch64-apple-darwin
            wheel: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: cargo build --release --locked -p hide-ffi

      # pyproject declares a readme; without this the build fails outright.
      - name: Stage the readme and licence
        shell: bash
        run: cp README.md LICENSE sdk/python/

      # The wheel carries the compiled core, so installing it needs no
      # toolchain on the user's machine.
      - name: Bundle the native library into the package
        shell: bash
        run: |
          set -euo pipefail
          for name in libhide_ffi.so libhide_ffi.dylib hide_ffi.dll; do
            if [ -f "target/release/$name" ]; then
              cp "target/release/$name" sdk/python/src/hide_protocol/
            fi
          done
          ls -la sdk/python/src/hide_protocol/

      - name: Test the package as installed
        shell: bash
        working-directory: sdk/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .
          python -m pytest -q

      # hatchling has no idea the package became platform-specific when the
      # native library was copied in, so it tags the wheel py3-none-any. All
      # three builds would then share one filename and PyPI would serve
      # whichever landed first to every platform. Retag with the real one.
      - name: Build the wheel
        shell: bash
        working-directory: sdk/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade wheel
          python -m build --wheel
          python -m wheel tags --remove \
            --platform-tag ${{ matrix.wheel }} \
            dist/*-py3-none-any.whl
          test -f dist/hide_protocol-${{ inputs.version }}-py3-none-${{ matrix.wheel }}.whl
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: sdk/python/dist/*.whl
          retention-days: 7

  pypi-upload:
    needs: pypi
    if: inputs.pypi && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    needs: verify
    if: inputs.npm
    runs-on: ubuntu-24.04
    environment: npm
    # --provenance signs the package with an OIDC token from this run.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles 10.x.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build the WASM package
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo build --release --locked -p hide-wasm --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/release/hide_wasm.wasm \
            --out-dir sdk/wasm --target web
          cp LICENSE sdk/wasm/

      # package.json lists both in "files"; npm omits a missing file silently,
      # which would publish a package with a blank page on the registry.
      - name: Stage the readme and licence
        run: cp README.md LICENSE sdk/node/

      - name: Build and test the Node package
        run: |
          set -euo pipefail
          cargo build --release --locked -p hide-ffi
          mkdir -p sdk/node/native
          cp target/release/libhide_ffi.so sdk/node/native/
          cd sdk/node
          npm ci
          npm run build
          HIDE_LIBRARY=$PWD/native/libhide_ffi.so node --test dist/index.test.js

      # No NODE_AUTH_TOKEN and no --provenance: the CLI detects OIDC, and
      # provenance is generated automatically under trusted publishing.
      - name: Publish
        if: '!inputs.dry_run'
        run: |
          set -euo pipefail
          npm --version
          npm publish --access public ./sdk/wasm
          # The Node package needs a native library per platform, which npm
          # cannot express in one tarball; published as source with a clear
          # error when the library is missing.
          npm publish --access public ./sdk/node

  rubygems:
    needs: verify
    if: inputs.rubygems
    runs-on: ubuntu-24.04
    environment: rubygems
    # Trusted publishing: no GEM_HOST_API_KEY secret.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the core and run the suite against it
        run: |
          set -euo pipefail
          cargo build --release --locked -p hide-ffi
          cd sdk/ruby
          HIDE_LIBRARY=$PWD/../../target/release/libhide_ffi.so \
            ruby -Ilib -Itest test/test_hide.rb

      - name: Stage the licence
        run: cp LICENSE sdk/ruby/

      # Pure Ruby via fiddle, so one gem serves every platform. The user
      # supplies the native library, as the README explains.
      - name: Build the gem
        working-directory: sdk/ruby
        run: gem build hide-protocol.gemspec

      # Exchanges the run's OIDC identity for a short-lived RubyGems credential
      # and writes it where `gem push` looks. rubygems/release-gem does not fit:
      # it drives `rake release`, and this gem is built with `gem build`.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: '!inputs.dry_run'
      - name: Publish
        if: '!inputs.dry_run'
        working-directory: sdk/ruby
        run: gem push hide-protocol-${{ inputs.version }}.gem

  nuget:
    needs: verify
    if: inputs.nuget
    runs-on: ubuntu-24.04
    environment: nuget
    # Trusted publishing: NuGet/login exchanges OIDC for a 1-hour API key.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0"

      - name: Build the core and run the suite against it
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/target/release/libhide_ffi.so
        run: |
          set -euo pipefail
          cargo build --release --locked -p hide-ffi
          dotnet test sdk/dotnet --verbosity quiet

      - name: Pack
        run: dotnet pack sdk/dotnet/HideProtocol/HideProtocol.csproj -c Release -o nupkg

      - name: NuGet login (OIDC -> short-lived key)
        if: '!inputs.dry_run'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The nuget.org profile name, not a credential.
          user: dragoscatalin
      - name: Publish
        if: '!inputs.dry_run'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push 'nupkg/*.nupkg' --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
