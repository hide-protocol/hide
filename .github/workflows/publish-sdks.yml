name: Publish SDKs

# Publishing to a registry claims a name permanently and, on crates.io and
# PyPI, cannot be undone — only yanked. So this never runs automatically on a
# tag: a person starts it, names the version, and says which registries.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.1)"
        required: true
      crates:
        description: "Publish the Rust crates to crates.io"
        type: boolean
        default: false
      pypi:
        description: "Publish the Python SDK to PyPI"
        type: boolean
        default: false
      npm:
        description: "Publish the Node and WASM SDKs to npm"
        type: boolean
        default: false
      rubygems:
        description: "Publish the Ruby SDK to RubyGems"
        type: boolean
        default: false
      nuget:
        description: "Publish the .NET SDK to NuGet"
        type: boolean
        default: false
      dry_run:
        description: "Build and validate everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Nothing is published unless the whole suite passes at the exact commit
  # being published.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: The version in the tree must match what is being published
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::Cargo.toml says $declared, but $"'{{ inputs.version }}'" was requested" >&2
            exit 1
          fi

  crates:
    needs: verify
    if: inputs.crates
    runs-on: ubuntu-24.04
    environment: crates-io
    # Trusted publishing: crates.io mints a short-lived token from this run's
    # OIDC identity, so no CARGO_REGISTRY_TOKEN secret is needed.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Order matters: a crate cannot be published before its dependencies.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          flags="--locked"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          # Dependency order: each crate's dependencies must already be on the
          # index when it is published, or cargo refuses it.
          for crate in hide-format hide-crypto hide-sign hide-transparency hide-epoch hide-identity hide-mls hide-keyring hide-object hide-ffi hide-cli; do
            echo "::group::$crate"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              # A dependent cannot resolve its sibling during a dry run: the
              # new version exists only in this checkout. That shows up either
              # as a missing crate (before its first publish) or as a missing
              # version (every release after). Both are expected; every other
              # error still fails the job.
              if ! out=$(cargo publish $flags -p "$crate" 2>&1); then
                echo "$out"
                echo "$out" | grep -Eq "no matching package named .hide-|failed to select a version for the requirement .hide-" \
                  || { echo "::error::$crate failed for a reason other than an unpublished sibling"; exit 1; }
                echo "::notice::$crate: sibling not on crates.io yet, expected before the first publish"
              else
                echo "$out"
              fi
            else
              # crates.io permits one NEW crate per 10 minutes, so a set this
              # size cannot go out in one pass. A half-published set cannot be
              # undone, so a rerun must skip what is already up rather than
              # start over: cargo's own error is the authority on that.
              published=yes
              for attempt in 1 2 3 4 5 6 7; do
                if out=$(cargo publish $flags -p "$crate" 2>&1); then
                  echo "$out"; break
                fi
                echo "$out"
                case "$out" in
                  *"already exists on crates.io index"*)
                    echo "::notice::$crate ${{ inputs.version }} is already published, skipping"
                    published=no; break ;;
                  *"429 Too Many Requests"*) ;;
                  *) echo "::error::$crate failed for a reason other than the rate limit"; exit 1 ;;
                esac
                echo "::notice::rate limited on $crate, waiting 10 minutes (attempt $attempt)"
                [ "$attempt" = 7 ] && { echo "::error::still rate limited after 7 attempts"; exit 1; }
                sleep 620
              done
              # crates.io needs a moment before a dependent crate can resolve it.
              if [ "$published" = yes ]; then sleep 30; fi
            fi
            echo "::endgroup::"
          done

  pypi:
    needs: verify
    if: inputs.pypi
    runs-on: ${{ matrix.os }}
    environment: pypi
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            wheel: manylinux_2_28_x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            wheel: win_amd64
          - os: macos-15
            target: aarch64-apple-darwin
            wheel: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: cargo build --release --locked -p hide-ffi

      # pyproject declares a readme; without this the build fails outright.
      - name: Stage the readme and licence
        shell: bash
        run: cp README.md LICENSE sdk/python/

      # The wheel carries the compiled core, so installing it needs no
      # toolchain on the user's machine.
      - name: Bundle the native library into the package
        shell: bash
        run: |
          set -euo pipefail
          for name in libhide_ffi.so libhide_ffi.dylib hide_ffi.dll; do
            if [ -f "target/release/$name" ]; then
              cp "target/release/$name" sdk/python/src/hide_protocol/
            fi
          done
          ls -la sdk/python/src/hide_protocol/

      - name: Test the package as installed
        shell: bash
        working-directory: sdk/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .
          python -m pytest -q

      # hatchling has no idea the package became platform-specific when the
      # native library was copied in, so it tags the wheel py3-none-any. All
      # three builds would then share one filename and PyPI would serve
      # whichever landed first to every platform. Retag with the real one.
      - name: Build the wheel
        shell: bash
        working-directory: sdk/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade wheel
          python -m build --wheel
          python -m wheel tags --remove \
            --platform-tag ${{ matrix.wheel }} \
            dist/*-py3-none-any.whl
          test -f dist/hide_protocol-${{ inputs.version }}-py3-none-${{ matrix.wheel }}.whl
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: sdk/python/dist/*.whl
          retention-days: 7

  pypi-upload:
    needs: pypi
    if: inputs.pypi && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # One compile of the core per platform, shared by npm, RubyGems and NuGet.
  # Building it inside each job would give three chances to disagree about
  # which binary a user gets.
  native:
    needs: verify
    if: inputs.npm || inputs.rubygems || inputs.nuget
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}

      - name: Install a cross linker
        if: matrix.cross
        run: |
          set -euo pipefail
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y --no-install-recommends musl-tools musl-dev
              # musl defaults to crt-static, and a cdylib cannot be statically
              # linked: the target builds cleanly and emits no .so at all.
              echo 'RUSTFLAGS=-C target-feature=-crt-static' >> "$GITHUB_ENV"
              ;;
          esac

      - run: cargo build --release --locked -p hide-ffi --target ${{ matrix.target }}

      # A library that cannot decrypt the frozen vectors is not shippable.
      # Cross-compiled ones cannot run here, so the check is host-native.
      - run: cargo test -p hide-object --test vectors --release
        if: '!matrix.cross'

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for name in libhide_ffi.so libhide_ffi.dylib hide_ffi.dll; do
            if [ -f "target/${{ matrix.target }}/release/$name" ]; then
              cp "target/${{ matrix.target }}/release/$name" out/
            fi
          done
          ls -la out
          test -n "$(ls -A out)"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: out/*
          retention-days: 7

  npm:
    needs: [verify, native]
    if: inputs.npm
    runs-on: ubuntu-24.04
    environment: npm
    # --provenance signs the package with an OIDC token from this run.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles 10.x.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build the WASM package
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo build --release --locked -p hide-wasm --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/release/hide_wasm.wasm \
            --out-dir sdk/wasm --target web
          cp LICENSE sdk/wasm/

      # package.json lists both in "files"; npm omits a missing file silently,
      # which would publish a package with a blank page on the registry.
      - name: Stage the readme and licence
        run: cp README.md LICENSE sdk/node/

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native

      # One npm package per platform, each refusing to install on the wrong
      # machine via os/cpu/libc. hide-protocol lists all seven as optional
      # dependencies, so exactly one resolves.
      - name: Build the platform packages
        run: |
          set -euo pipefail
          for dir in native/native-*; do
            target="${dir#native/native-}"
            library=$(ls "$dir")
            node scripts/pack-native.mjs npm "$target" "${{ inputs.version }}" \
              "$dir/$library" platform-packages
          done
          ls -la platform-packages/*

      - name: Build and test the Node package
        run: |
          set -euo pipefail
          cd sdk/node
          npm ci
          npm run build
          HIDE_LIBRARY=$GITHUB_WORKSPACE/native/native-x86_64-unknown-linux-gnu/libhide_ffi.so \
            node --test dist/index.test.js

      # The published loader must find the published package, not a stray copy
      # left in the build tree. Installing the tarballs into a clean directory
      # is the only thing that proves it.
      - name: Prove the platform package resolves with nothing else present
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" ./sdk/node >/dev/null
          npm pack --pack-destination "$RUNNER_TEMP" ./platform-packages/linux-x64 >/dev/null
          work=$(mktemp -d)
          cd "$work"
          echo '{"name":"probe","private":true,"type":"module"}' > package.json
          npm install --silent \
            "$RUNNER_TEMP"/hide-protocol-${{ inputs.version }}.tgz \
            "$RUNNER_TEMP"/hide-protocol-linux-x64-${{ inputs.version }}.tgz
          env -u HIDE_LIBRARY node -e "
            const m = await import('hide-protocol');
            const sk = m.SecretKey.generate();
            const c = m.encrypt(Buffer.from('secret'), [sk.publicKey()]);
            if (m.decrypt(c, sk).data.toString() !== 'secret') throw new Error('round trip failed');
            console.log('resolved the platform package with no HIDE_LIBRARY');
          "

      # No NODE_AUTH_TOKEN and no --provenance: the CLI detects OIDC, and
      # provenance is generated automatically under trusted publishing.
      - name: Publish
        if: '!inputs.dry_run'
        run: |
          set -euo pipefail
          npm --version
          # A rerun after a partial failure must not stop at the packages that
          # already went out. Without ./ npm reads a bare relative path as a
          # git shorthand and tries to clone it over ssh.
          publish() {
            if out=$(npm publish --access public "$1" 2>&1); then
              echo "$out"
            else
              echo "$out"
              echo "$out" | grep -q "cannot publish over the previously published" \
                || { echo "::error::$1 failed for a reason other than being already published"; exit 1; }
              echo "::notice::$1 is already on npm at this version"
            fi
          }
          publish ./sdk/wasm
          # The platform packages must exist before the package that depends on
          # them, or the first install of hide-protocol resolves nothing.
          for dir in platform-packages/*; do
            publish "./$dir"
          done
          publish ./sdk/node

  rubygems:
    needs: [verify, native]
    if: inputs.rubygems
    runs-on: ubuntu-24.04
    environment: rubygems
    # Trusted publishing: no GEM_HOST_API_KEY secret.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native

      - name: Run the suite against the built core
        run: |
          set -euo pipefail
          cd sdk/ruby
          HIDE_LIBRARY=$GITHUB_WORKSPACE/native/native-x86_64-unknown-linux-gnu/libhide_ffi.so \
            ruby -Ilib -Itest test/test_hide.rb

      - name: Stage the licence
        run: cp LICENSE sdk/ruby/

      # One gem per platform: `gem install` then fetches only this machine's
      # binary instead of all seven. The loader looks beside binding.rb, which
      # is where pack-native.mjs puts it and what the gemspec globs.
      - name: Build a gem per platform
        run: |
          set -euo pipefail
          mkdir -p gems
          for dir in native/native-*; do
            target="${dir#native/native-}"
            library=$(ls "$dir")
            rm -f sdk/ruby/lib/hide_protocol/*.so sdk/ruby/lib/hide_protocol/*.dylib \
                  sdk/ruby/lib/hide_protocol/*.dll
            platform=$(node scripts/pack-native.mjs gem "$target" "${{ inputs.version }}" "$dir/$library")
            ( cd sdk/ruby && HIDE_GEM_PLATFORM="$platform" gem build hide-protocol.gemspec )
            mv sdk/ruby/hide-protocol-${{ inputs.version }}-"$platform".gem gems/
          done
          ls -la gems

      # A gem that installs but cannot load its own binary is worse than one
      # that refuses: prove the vendored library is found with nothing else set.
      - name: Prove the vendored library loads
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gem install --no-document --install-dir "$work" \
            gems/hide-protocol-${{ inputs.version }}-x86_64-linux.gem
          env -u HIDE_LIBRARY GEM_HOME="$work" ruby \
            -I "$work/gems/hide-protocol-${{ inputs.version }}-x86_64-linux/lib" -e '
              require "hide_protocol"
              sk = Hide::SecretKey.generate
              c = Hide.encrypt("secret", recipients: [sk.public_key])
              raise "round trip failed" unless Hide.decrypt(c, sk).data == "secret"
              puts "loaded the vendored library with no HIDE_LIBRARY"
            '

      # Exchanges the run's OIDC identity for a short-lived RubyGems credential
      # and writes it where `gem push` looks. rubygems/release-gem does not fit:
      # it drives `rake release`, and this gem is built with `gem build`.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        if: '!inputs.dry_run'
      - name: Publish
        if: '!inputs.dry_run'
        run: |
          set -euo pipefail
          for gem in gems/*.gem; do
            gem push "$gem"
          done

  nuget:
    needs: [verify, native]
    if: inputs.nuget
    runs-on: ubuntu-24.04
    environment: nuget
    # Trusted publishing: NuGet/login exchanges OIDC for a 1-hour API key.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native

      - name: Run the suite against the built core
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/native/native-x86_64-unknown-linux-gnu/libhide_ffi.so
        run: dotnet test sdk/dotnet --verbosity quiet

      # NuGet can carry every platform in one package, so unlike npm and
      # RubyGems there is nothing to fan out: the runtime picks the folder.
      - name: Stage the binaries under their runtime identifiers
        run: |
          set -euo pipefail
          node -e '
            const {mkdirSync, copyFileSync, readdirSync, readFileSync} = require("node:fs");
            const {targets} = JSON.parse(readFileSync("sdk/native-targets.json", "utf8"));
            for (const t of targets) {
              const from = `native/native-${t.target}`;
              const dir = `sdk/dotnet/HideProtocol/runtimes/${t.rid}/native`;
              mkdirSync(dir, {recursive: true});
              copyFileSync(`${from}/${readdirSync(from)[0]}`, `${dir}/${t.library}`);
            }
          '
          find sdk/dotnet/HideProtocol/runtimes -type f

      - name: Pack
        run: dotnet pack sdk/dotnet/HideProtocol/HideProtocol.csproj -c Release -o nupkg

      - name: The package must carry a binary for every runtime
        run: |
          set -euo pipefail
          unzip -l nupkg/HideProtocol.${{ inputs.version }}.nupkg | grep runtimes/
          for rid in linux-x64 linux-arm64 linux-musl-x64 win-x64 win-arm64 osx-arm64 osx-x64; do
            unzip -l nupkg/HideProtocol.${{ inputs.version }}.nupkg \
              | grep -q "runtimes/$rid/native/" \
              || { echo "::error::the package has no native library for $rid"; exit 1; }
          done

      - name: NuGet login (OIDC -> short-lived key)
        if: '!inputs.dry_run'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The nuget.org profile name, not a credential.
          user: dragoscatalin
      - name: Publish
        if: '!inputs.dry_run'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push 'nupkg/*.nupkg' --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
