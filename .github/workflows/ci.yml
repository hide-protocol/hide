name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tags are not built here. A tag always points at a commit already pushed to
# main, so running the whole matrix again duplicates ~190 job-minutes and
# proves nothing new; Release verifies the artifacts it actually ships.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Formatting and lint are platform-independent, so they run once instead of
  # three times; a failure here cancels the matrix and saves runner minutes.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The version lives in 22 files across seven ecosystems. A missed manifest
      # publishes a package whose metadata and contents disagree, and nothing
      # else in CI would notice.
      - run: pwsh -File scripts/set-version.ps1 -Check
        shell: bash

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-features

  # The desktop app is outside the cargo workspace, so it needs its own job.
  # Linux only: this checks the shared logic and the CLI/desktop interop, and
  # the release workflow is what builds every platform's bundle.
  desktop:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/hide-desktop/src-tauri
          key: desktop
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
        working-directory: apps/hide-desktop/src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: apps/hide-desktop/src-tauri

      # The interop test skips itself when the CLI is absent, which would make
      # it silently decorative. Build the CLI first, then assert it ran.
      - run: cargo build -p hide-cli
      - name: Desktop tests, including CLI interoperability
        run: |
          set -euo pipefail
          cargo test --manifest-path apps/hide-desktop/src-tauri/Cargo.toml \
            --all-features -- --nocapture | tee desktop-tests.log
          if grep -q 'skipping: the hide CLI has not been built' desktop-tests.log; then
            echo "::error::the interoperability test skipped itself" >&2
            exit 1
          fi

  # The SDKs are the surface most likely to drift from the ABI without anyone
  # noticing, because they live outside the cargo workspace.
  sdks:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "22"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: ffi
          ini-values: ffi.enable=1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0"

      - name: Build the core and the CLI
        run: cargo build -p hide-ffi -p hide-cli

      - name: Python
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/target/debug/libhide_ffi.so
          HIDE_ALLOW_LIBRARY_OVERRIDE: "1"
          PYTHONPATH: ${{ github.workspace }}/sdk/python/src
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q sdk/python/tests

      - name: Node
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/target/debug/libhide_ffi.so
          HIDE_ALLOW_LIBRARY_OVERRIDE: "1"
        working-directory: sdk/node
        run: |
          # Not npm ci: at version-bump time the platform packages for the
          # new version do not exist on npm yet, so the lockfile records them
          # with an empty version and npm ci refuses it after every release.
          # npm install still honours the lockfile for everything resolvable.
          npm install --no-audit --no-fund
          npm run build
          node --test dist/index.test.js

      - name: Go
        run: |
          set -euo pipefail
          mkdir -p sdk/go/include sdk/go/lib
          cp crates/hide-ffi/include/hide.h sdk/go/include/
          cp target/debug/libhide_ffi.a sdk/go/lib/
          cd sdk/go && CGO_ENABLED=1 go test ./...

      - name: Java
        run: |
          set -euo pipefail
          mkdir -p target/java-classes
          javac -d target/java-classes $(find sdk/java/src -name '*.java')
          java --enable-native-access=ALL-UNNAMED \
               -Dhide.library="$PWD/target/debug/libhide_ffi.so" \
               -Dhide.allowLibraryOverride=true \
               -cp target/java-classes org.hideprotocol.HideTest

      - name: Ruby
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/target/debug/libhide_ffi.so
          HIDE_ALLOW_LIBRARY_OVERRIDE: "1"
        working-directory: sdk/ruby
        run: ruby -Ilib -Itest test/test_hide.rb

      - name: PHP
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/target/debug/libhide_ffi.so
          HIDE_ALLOW_LIBRARY_OVERRIDE: "1"
        working-directory: sdk/php
        run: php -d ffi.enable=1 tests/run.php

      - name: .NET
        env:
          HIDE_LIBRARY: ${{ github.workspace }}/target/debug/libhide_ffi.so
          HIDE_ALLOW_LIBRARY_OVERRIDE: "1"
        working-directory: sdk/dotnet
        run: dotnet test --verbosity quiet

      - name: C ABI
        run: cargo test -p hide-ffi --test c_abi -- --nocapture | tee c-abi.log

      - name: The C ABI test must not have skipped itself
        run: |
          if grep -q 'skipping: no C compiler' c-abi.log; then
            echo "::error::the C ABI test skipped itself" >&2
            exit 1
          fi

      # Every surface must agree on the format, or one of them has drifted.
      - name: Cross-surface interoperability
        # CI has every runtime, so name them: without this a missing runtime
        # would quietly shrink the matrix instead of failing.
        env:
          HIDE_CROSS_REQUIRE: ruby,php,dotnet
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          cargo build --release -p hide-wasm --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/release/hide_wasm.wasm \
            --out-dir conformance/cross-surface/wasm --target web
          dotnet build -c Release conformance/cross-surface/adapters/dotnet
          node conformance/cross-surface/verify.mjs

  # Proves the wire format is implementable from the spec alone.
  interoperability:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: cargo test -p hide-object --test vectors
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: conformance/node
      - run: node verify.mjs
        working-directory: conformance/node

  minimum-supported-rust:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - run: cargo check --workspace --all-features

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustsec/audit-check compiles cargo-audit from source on every run,
      # which was 189s of the 190s job. This installs a prebuilt binary.
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --deny warnings
      # deny.toml adds what audit does not: licence allow-list, banned crates
      # (a second crypto stack), unknown registries, and duplicate versions
      # with every known duplicate attributed so a new one is visible.
      - run: cargo deny check

  # Coverage-guided fuzzing of every parser that sees attacker bytes. Short on
  # every push so a regression that panics on malformed input is caught the
  # same day; the corpus under fuzz/corpus is what makes even 30 s meaningful.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-fuzz
      - name: Seed each corpus with the frozen vectors
        run: |
          set -euo pipefail
          mkdir -p fuzz/corpus/{format_header,object_open,keyring_open,identity_log,epoch_chain,transparency_proofs,challenge_decode,mls_message}
          cp conformance/vectors/*.hide fuzz/corpus/format_header/
          cp conformance/vectors/*.hide fuzz/corpus/object_open/
          cp conformance/vectors/*.test-secret conformance/vectors/*.test-seed fuzz/corpus/keyring_open/
          cp conformance/vectors/subsystems/identity-*.bin fuzz/corpus/identity_log/
          cp conformance/vectors/subsystems/epoch-*.bin fuzz/corpus/epoch_chain/
          cp conformance/vectors/subsystems/*root*.bin fuzz/corpus/transparency_proofs/
          # challenge_decode and mls_message have no frozen vectors: a challenge
          # carries a fresh nonce and an MLS message a fresh group state, so
          # neither is a stable artifact. They start from the empty corpus.
      - name: Fuzz every target for 45 seconds
        working-directory: fuzz
        # rust-toolchain.toml pins stable for the repo; cargo-fuzz needs
        # nightly, so it is named explicitly. The target is named too: the
        # runner's default resolved to musl, and AddressSanitizer cannot link
        # against a static libc.
        run: |
          set -euo pipefail
          for target in format_header object_open keyring_open identity_log epoch_chain transparency_proofs challenge_decode mls_message; do
            echo "::group::$target"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=45 -timeout=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep any crash as an artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
