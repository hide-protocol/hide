name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Formatting and lint are platform-independent, so they run once instead of
  # three times; a failure here cancels the matrix and saves runner minutes.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The desktop app is outside the cargo workspace, so it needs its own job.
  # Linux only: this checks the shared logic and the CLI/desktop interop, and
  # the release workflow is what builds every platform's bundle.
  desktop:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hide-desktop/src-tauri
          key: desktop
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --check
        working-directory: apps/hide-desktop/src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: apps/hide-desktop/src-tauri

      # The interop test skips itself when the CLI is absent, which would make
      # it silently decorative. Build the CLI first, then assert it ran.
      - run: cargo build -p hide-cli
      - name: Desktop tests, including CLI interoperability
        run: |
          set -euo pipefail
          cargo test --manifest-path apps/hide-desktop/src-tauri/Cargo.toml \
            --all-features -- --nocapture | tee desktop-tests.log
          if grep -q 'skipping: the hide CLI has not been built' desktop-tests.log; then
            echo "::error::the interoperability test skipped itself" >&2
            exit 1
          fi

  # Proves the wire format is implementable from the spec alone.
  interoperability:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo test -p hide-object --test vectors
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: conformance/node
      - run: node verify.mjs
        working-directory: conformance/node

  minimum-supported-rust:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-features

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
