name: supply-chain

# The `supply-chain` job in ci.yml only runs when somebody pushes. Advisories
# are published on their own calendar: the ones dated 2026-10-23 were noticed
# four days later, and only because dependabot pull requests happened to go
# red. This reads the advisory database every Monday against what is on main,
# for both lockfiles that ship, and opens an issue instead of waiting for the
# next push to find out.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it uses.
permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  # The same four checks as the `supply-chain` job in ci.yml; change them
  # together. Every check runs even when an earlier one failed, so one issue
  # lists everything that is wrong this week.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      advisories: ${{ steps.collect.outputs.advisories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit,cargo-deny

      # The step names are quoted in the issue; keep them descriptive.
      - name: cargo audit, root lockfile
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo audit --deny warnings --color never 2>&1 | tee "$RUNNER_TEMP/audit-root.log"
      - name: cargo deny, root workspace
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo deny --locked --color never check 2>&1 | tee "$RUNNER_TEMP/deny-root.log"
      # From its own directory, so cargo-audit reads the desktop Cargo.lock and
      # the ignore list beside it (apps/hide-desktop/src-tauri/.cargo/audit.toml).
      - name: cargo audit, desktop lockfile
        if: ${{ !cancelled() }}
        working-directory: apps/hide-desktop/src-tauri
        run: |
          set -euo pipefail
          cargo audit --deny warnings --color never 2>&1 | tee "$RUNNER_TEMP/audit-desktop.log"
      # Advisories for this tree are cargo-audit's job, above; a second ignore
      # list in a second format would only be a second thing to keep in step.
      - name: cargo deny, desktop tree (bans, licences, sources)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo deny --locked --color never \
            --manifest-path apps/hide-desktop/src-tauri/Cargo.toml \
            --config deny.toml \
            check bans licenses sources 2>&1 | tee "$RUNNER_TEMP/deny-desktop.log"

      # The issue should name the advisories, not send the reader to a log.
      - name: Collect the advisory ids that were reported
        id: collect
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          ids=$(cat "$RUNNER_TEMP"/audit-*.log "$RUNNER_TEMP"/deny-*.log 2> /dev/null \
            | grep -oE 'RUSTSEC-[0-9]{4}-[0-9]{4}' | sort -u | tr '\n' ' ' || true)
          echo "advisories=$ids" >> "$GITHUB_OUTPUT"
          echo "reported: ${ids:-none (a policy check failed, not an advisory)}"

  # Separate job so the token that can write issues never runs next to the
  # tools that read the dependency tree. `!cancelled()` rather than
  # `failure()`: a job that hit its time limit is reported too, a run somebody
  # cancelled by hand is not.
  report:
    needs: audit
    if: ${{ !cancelled() && needs.audit.result != 'success' && needs.audit.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ADVISORIES: ${{ needs.audit.outputs.advisories }}
      RESULT: ${{ needs.audit.result }}
    steps:
      - name: Open or update the supply-chain issue
        run: |
          set -euo pipefail
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "audit") | .steps[]? | select(.conclusion == "failure") | "- " + .name' || true)
          {
            echo "The scheduled supply-chain check failed on \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA:0:12}\` (the audit job ended as \`$RESULT\`)."
            echo
            echo "Failed checks:"
            echo "${failed:-- none recorded: the job did not get as far as a check}"
            echo
            if [ -n "${ADVISORIES// /}" ]; then
              echo "Advisories named in the output:"
              for id in $ADVISORIES; do echo "- [$id](https://rustsec.org/advisories/$id)"; done
              echo
            fi
            echo "Run: $RUN_URL"
            echo
            echo "What to do: \`cargo update -p <crate>\` in the lockfile that is named, when a fixed version exists. An advisory may be ignored only when no update removes it, with the dependency path and the reason written beside it: \`.cargo/audit.toml\` and \`deny.toml\` for the root, \`apps/hide-desktop/src-tauri/.cargo/audit.toml\` for the desktop app."
          } > body.md
          gh label create supply-chain --color D93F0B \
            --description "A dependency advisory or policy check failed" 2> /dev/null || true
          title="supply-chain: the weekly dependency check failed"
          # Exact title match on the list, not the search index: search lags
          # by minutes and matches loosely.
          existing=$(gh issue list --state open --label supply-chain --limit 200 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label supply-chain --body-file body.md
          fi

  # GitHub switches off every scheduled workflow of a repository after 60 days
  # without repository activity, without telling anyone. This project has
  # quiet months, and the nightly fuzzer is the one thing that must keep
  # running through them. Enabling a workflow through the API restarts its 60
  # days (the mechanism keepalive actions rely on), so doing it weekly means
  # the limit is never reached, and a workflow that was switched off anyway is
  # switched back on. It cannot wake THIS workflow once it has itself been
  # switched off; it works only by never letting that happen.
  keep-schedules-enabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # gh workflow enable
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The list is whatever has a `schedule:` trigger today, so a new
      # scheduled workflow is covered without anyone remembering this file.
      - name: Re-enable every scheduled workflow
        run: |
          set -euo pipefail
          found=0
          while read -r path; do
            [ -n "$path" ] || continue
            found=$((found + 1))
            file=$(basename "$path")
            if ! state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file" --jq .state); then
              echo "::warning::$file is not known to GitHub yet (not on the default branch?)"
              continue
            fi
            case "$state" in
              # On an active workflow this changes nothing visible; it only
              # restarts the countdown.
              active | disabled_inactivity)
                gh workflow enable "$file"
                echo "$file: was $state, enabled"
                ;;
              # Somebody switched it off on purpose. Undoing that every Monday
              # would be a surprise, so say it and leave it.
              *)
                echo "::warning::$file is $state and was left that way"
                ;;
            esac
          done < <(grep -lE '^[[:space:]]+schedule:[[:space:]]*$' .github/workflows/*.yml || true)
          [ "$found" -gt 0 ] || { echo "::error::no scheduled workflow found; the pattern above no longer matches"; exit 1; }
