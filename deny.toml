# cargo-deny: advisories, licences, duplicate versions and dependency sources.
# `cargo audit` covers only the first. The wire format depends on the exact
# pinned crates, so a silently duplicated or swapped dependency is a
# correctness problem here, not just hygiene.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keep in sync with .cargo/audit.toml (read by `cargo audit`): every ignore
# needs the same written reason in both files. None today.
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  # minicbor, the canonical CBOR codec the whole wire format rests on.
  "BlueOak-1.0.0",
]
confidence-threshold = 0.8

[bans]
# Two versions of one crate double the audit surface and the binary; when it
# happens it should be a decision, listed below, not an accident.
multiple-versions = "warn"
# mls-rs-crypto-rustcrypto 0.23 moved to the current RustCrypto generation, so
# the old skip-tree for it is gone. Each duplicate left is attributed below;
# anything else duplicating is new drift.
skip = [
  # hpke 0.15.1 uses sha3 0.12 itself and ml-kem 0.3.2 (its dependency) still
  # uses 0.11. Upstream mismatch; goes away when ml-kem releases against 0.12.
  { crate = "sha3@0.11.0", reason = "ml-kem 0.3.2 lags hpke on sha3" },
  # proptest 1.11 (dev-dependency only, never shipped) is still on rand 0.9.
  { crate = "rand@0.9.5", reason = "proptest 1.11, dev-only" },
  { crate = "rand_core@0.9.5", reason = "proptest 1.11, dev-only" },
  { crate = "getrandom@0.3.4", reason = "proptest 1.11 via rand_core 0.9, dev-only" },
]
# Path-only dependencies inside the workspace have no version field and would
# count as wildcards; those are not published (hide-wasm) or are dev-only.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Anything that ships its own crypto instead of the audited RustCrypto/HPKE
  # stack used here. Adding a primitive is a protocol decision.
  { crate = "openssl", reason = "one cryptographic stack; see AGENTS.md" },
  { crate = "ring", reason = "one cryptographic stack; see AGENTS.md" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
